name: CI

on:
  # Fork patch (docs/fork/DECISIONS.md 2026-11-22, Actions usage): pushes skip changes that only
  # touch fork maintenance notes and records the suite never reads. tools/**, .github/workflows/**
  # and .github/dependency-deferrals.json stay in: test/fork-tools.test.ts runs tools/tests, which
  # reads the real workflow pins and npm manifests.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - "design/**"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "FORK.md"
      - "NOTICE.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.en.md"
      - "upstream-review-report.md"
      - "tools/upstream_baseline.json"
      - ".github/dependabot.yml"
  # No path filter on pull requests: "Windows CI" is the required status check on main, and a
  # filtered-out required check stays "Expected — waiting" forever.
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg on Windows
        run: choco install ffmpeg --yes --no-progress

      - name: Inspect the installed media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

