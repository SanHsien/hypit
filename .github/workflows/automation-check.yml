name: Check repository analysis
on:
  pull_request:
    paths: ['.github/automation/**', '.github/workflows/repository-analysis.yml', '.github/workflows/automation-check.yml']
  push:
    branches: [main]
    paths: ['.github/automation/**', '.github/workflows/repository-analysis.yml', '.github/workflows/automation-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/automation/analysis.test.mjs
