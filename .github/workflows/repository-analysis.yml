name: Repository analysis
on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to analyze
        type: choice
        options: [issue, pr]
        required: true
      number:
        description: Issue or PR number
        type: string
        required: true
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: hypit-analysis-${{ inputs.kind }}-${{ inputs.number }}
  cancel-in-progress: true
jobs:
  analyze:
    if: github.repository == 'hypit-ai/hypit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the trusted workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read the selected issue or PR
        env:
          ANALYSIS_CONTEXT: ${{ runner.temp }}/hypit-analysis/context.json
          GH_TOKEN: ${{ github.token }}
        run: node .github/automation/analysis.mjs prepare
      - name: Analyze and write the run summary
        env:
          ANALYSIS_CONTEXT: ${{ runner.temp }}/hypit-analysis/context.json
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYSIS_MODEL: deepseek-flash
          ANALYSIS_MAX_TOKENS: '8192'
        run: node .github/automation/analysis.mjs analyze
