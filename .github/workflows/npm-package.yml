name: npm package execution

on:
  # Fork patch (docs/fork/DECISIONS.md 2026-11-22, Actions usage): not a required check, so pull
  # requests that only touch fork maintenance files (tools, notes, Dependabot and deferral config,
  # fork-only workflows) skip the Windows + Linux package run.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - "design/**"
      - "tools/**"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "FORK.md"
      - "NOTICE.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.en.md"
      - "upstream-review-report.md"
      - ".github/dependabot.yml"
      - ".github/dependency-deferrals.json"
      - ".github/workflows/upstream-check.yml"
      - ".github/workflows/dependency-freshness.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/automation-check.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Version of the installed and executed tarball
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

concurrency:
  group: npm-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the local media toolchain on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare the local media toolchain on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Read the package version
        id: version
        run: node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
      - name: Build the npm package and README
        run: npm run pack:distribution
      - name: Install, render and export outside the checkout
        run: npm run check:distribution -- "dist/release/hypit-hypit-${{ steps.version.outputs.version }}.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: npm-package
          path: |
            dist/release/*.tgz
            dist/release/README.md
          if-no-files-found: error
