version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]
    groups:
      npm:
        patterns: ["*"]
      # Security updates are not covered by the version-update group above; without this each
      # advisory opens its own PR, and every PR runs CI, CodeQL and the npm package check.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
