packages:
  - packages/*
  - services/*
  # Shipped examples are repository fixtures. Real authored projects always live outside this
  # tool checkout and resolve their own project-local packages through the Host's project root.
  - examples/*/packages/*

# Security pins (see docs/fork/DECISIONS.md, 2026-09-30). Each stays inside the dependent's major.
overrides:
  # @hyperframes/* pin hono to exactly 4.12.32; fixes are 4.12.34 / 4.13.5.
  hono: ^4.13.5
  # vitepress 1.x asks for vite ^5.4.14, which has no patched release; 6.4.4 is the fixed 6.x.
  vitepress>vite: ^6.4.4
  # postcss 8.5.25 (via @hyperframes/core) resolves nanoid 3.3.16; 3.3.18 is the fixed 3.x.
  nanoid: ^3.3.18
  # @hyperframes/engine asks for puppeteer ^25.2.1, which the old lockfile resolved to 25.5.0 and
  # chromium-bidi 17 / zod 3 (GHSA-mrhx-c7xc-m3w5, fixed only in zod >= 4.6.6; alert #109).
  # Floor-style: anything older than 25.16.0 is lifted to the same major; newer majors are left alone.
  "puppeteer@<25.16.0": ^25.16.0
  # @hyperframes/engine and producer ask for ^2.0.5, which the old lockfile resolved to 2.0.12
  # (alert #116); 2.1.3 is the fixed 2.x.
  "@hono/node-server": ^2.1.3
  # @hyperframes/engine pins undici to exactly 7.25.0, so no in-range update reaches the fixes
  # (alerts #118-#146; the newest patched release is 7.30.1). Stay inside the 7.x major.
  undici: ^7.30.1
